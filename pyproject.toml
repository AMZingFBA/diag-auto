[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diagauto"
version = "0.1.0"
description = "DiagAuto : remplir LICIEL automatiquement à partir des données de terrain"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
diagauto = "diagauto.cli:main"

[tool.setuptools.packages.find]
include = ["diagauto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
